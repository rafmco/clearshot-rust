name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: Compress-Archive target/release/clearshot.exe clearshot-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: clearshot-windows-x64.zip